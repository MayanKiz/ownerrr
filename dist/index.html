<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Mayank Yadav | Developer</title>

  <meta
    name="description"
    content="Mayank Yadav, CSE student, AI & ML enthusiast, developer and cybersecurity enthusiast."
  />

  <style>
    :root {
      --black-1: #050505;
      --white-1: #ffffff;

      --red-1: #ff5555;
      --red-5: #260606;

      --orange-1: #ff8a00;
      --orange-5: #2b1200;

      --yellow-1: #ffe600;
      --lime-1: #b7ff00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--black-1);
      color: var(--white-1);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition: background 0.75s ease;
    }

    .wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .slides {
      width: min(1100px, 100%);
      height: min(650px, 90vh);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      pointer-events: none;
      text-align: center;
    }

    .slide-content {
      width: 100%;
      padding: 30px;
    }

    .slide p {
      margin: 18px 0;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .slide:nth-child(1) p.center {
      font-size: clamp(3rem, 9vw, 8rem);
    }

    .slide:nth-child(1) p:not(.center) {
      font-size: clamp(1rem, 2vw, 1.4rem);
    }

    .slide:nth-child(2) p {
      font-size: clamp(2rem, 5vw, 5rem);
    }

    .slide:nth-child(3) p {
      font-size: clamp(2rem, 5vw, 5rem);
    }

    .tag {
      display: inline-block;
      font-size: 0.85rem !important;
      letter-spacing: 0.15em !important;
      text-transform: uppercase;
      opacity: 0.7;
      font-weight: 500 !important;
    }

    .footer {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);

      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;

      opacity: 0.45;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .wrapper {
        padding: 15px;
      }

      .slides {
        height: 80vh;
      }

      .slide-content {
        padding: 15px;
      }

      .footer {
        bottom: 15px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="wrapper">
    <section class="slides">

      <!-- SLIDE 1 -->
      <div class="slide">
        <div class="slide-content">

          <p class="tag">
            Developer • AI • Cybersecurity
          </p>

          <p class="center">
            Mayank Yadav
          </p>

          <p>
            CSE • AI &amp; ML
          </p>

          <p>
            Building things with code.
          </p>

        </div>
      </div>


      <!-- SLIDE 2 -->
      <div class="slide">
        <div class="slide-content">

          <p>
            Web Developer
          </p>

          <p>
            AI &amp; ML Enthusiast
          </p>

          <p>
            Cybersecurity Explorer
          </p>

        </div>
      </div>


      <!-- SLIDE 3 -->
      <div class="slide">
        <div class="slide-content">

          <p>
            Always Building
          </p>

        </div>
      </div>

    </section>
  </main>

  <div class="footer">
    Mayank Yadav • 2026
  </div>

  <script type="module" src="./script.js"></script>

</body>
</html>
